# Yorishiro Project Configuration
# See docs/architecture.md for schema documentation.

project:
  name: "竹取物語"
  code: "BambooCutter"

sources:
  - id: "bc"
    type: novel
    path: "raw/BambooCutter.md"
    authority: PRIMARY
    language: ja
    title: "竹取物語"
    year: N/A

providers:
  openrouter:
    type: openrouter
    # api_key: your api key from openrouter

steps:
  novel.scenes:
    backend: pydantic-ai
    provider: openrouter
    model: anthropic/claude-sonnet-4-6
    thinking: medium
    output_mode: tool
    max_chunk_size: 32000
  novel.aliases:
    backend: pydantic-ai
    provider: openrouter
    model: openai/gpt-5.4-mini
    thinking: medium
    output_mode: tool
  novel.characters:
    backend: pydantic-ai
    provider: openrouter
    model: openai/gpt-5.4-mini
    thinking: medium
    output_mode: tool
  cross.synthesize:
    backend: pydantic-ai
    provider: openrouter
    model: openai/gpt-5.4-mini
    thinking: medium
    output_mode: tool
