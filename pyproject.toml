[project]
name = "yorishiro"
version = "0.3.0"
description = "Fictional character soul document generator and chat system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "calibre>=6.0.0",      # epub parsing
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
