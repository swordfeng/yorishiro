[project]
name = "yorishiro"
version = "0.3.0"
description = "Fictional character soul document generator and chat system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "ebooklib>=0.5", # epub parsing
    "pyyaml>=6.0.3",
    "pydantic-ai[openai]>=0.0.14",
    "regex>=2024.0.0",
    "tiktoken>=0.5.0",
    "hdbscan>=0.8.42",
    "scikit-learn>=1.8.0",
    "addict>=2.4.0",
    "datasets>=4.8.4",
    "simplejson>=3.20.2",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.10.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
film = [
    "scenedetect[opencv]<0.7", # video shot detection
    "opencv-python-headless>=4.9.0", # keyframe processing
    "av>=12.0.0", # PyAV - video processing (supports AVIF)
    "torch>=2.0.0", # CLIP, pyannote, emotion2vec
    "torchvision>=0.15.0", # CLIP
    "transformers>=4.40.0", # CLIP, kotoba-whisper pipeline
    "openai-whisper>=20231117", # faster-whisper alternative
    "faster-whisper>=1.0.0", # STT (faster-whisper backend)
    "punctuators>=0.0.5", # kotoba-whisper punctuation
    "stable-ts>=2.16.0", # kotoba-whisper timestamp stabilization
    "pyannote.audio>=3.1.0", # speaker diarization
    "huggingface-hub>=0.20.0", # model downloads
    "librosa>=0.10.0", # audio processing
    "silero-vad>=5.0", # VAD preprocessing
    "demucs>=4.0.0", # music/vocals separation
    "soundfile>=0.12.0", # audio file I/O
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tqdm>=4.60.0",
    "funasr>=1.3.1",
    "speechbrain>=1.1.0",
    "nemo-toolkit>=2.7.2",
    "fiddle>=0.3.0",
    "soxr>=1.0.0",
    "qwen-asr>=0.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yorishiro"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "coverage[toml]>=7.10.0",
    "ruff>=0.15.7",
    "ty>=0.0.27",
]
film = [
    "nltk>=3.9.4",
]

[tool.coverage.run]
branch = true
source = ["yorishiro"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.uv.sources]
