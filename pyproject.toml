[project]
name = "yorishiro"
version = "0.3.0"
description = "Fictional character soul document generator and chat system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "ebooklib>=0.5", # epub parsing
    "pyyaml>=6.0.3",
    "pydantic-ai[openai]>=0.0.14",
    "regex>=2024.0.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yorishiro"]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.27",
]
